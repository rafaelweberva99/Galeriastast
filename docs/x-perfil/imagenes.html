<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #0c110e; }
  .grass {
    background:
      repeating-linear-gradient(90deg, #1c6b3c 0 120px, #227a46 120px 240px);
    position: relative; overflow: hidden; color: #f4f7f2;
  }
  .chalk { position: absolute; border: 4px solid rgb(255 255 255 / 0.35); }
  /* Foto de perfil: X la recorta en círculo */
  #avatar { width: 400px; height: 400px; display: grid; place-items: center; }
  #avatar .chalk.c { width: 300px; height: 300px; border-radius: 50%; left: 50px; top: 50px; }
  #avatar .inner { position: relative; text-align: center; }
  #avatar svg { display: block; margin: 0 auto 10px; filter: drop-shadow(0 6px 10px rgb(0 0 0 / .35)); }
  #avatar .name { font: 700 64px/1 Oswald, sans-serif; letter-spacing: .02em; text-transform: uppercase;
    text-shadow: 0 4px 10px rgb(0 0 0 / .35); }
  /* Portada 1500x500 */
  #banner { width: 1500px; height: 500px; }
  #banner .chalk.mid { left: 749px; top: 0; height: 500px; width: 0; border-width: 0 0 0 4px; }
  #banner .chalk.c { width: 360px; height: 360px; border-radius: 50%; left: 570px; top: 70px; }
  #banner .content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 70px; padding-left: 120px; }
  #banner h1 { font: 700 104px/0.95 Oswald, sans-serif; text-transform: uppercase; letter-spacing: .01em;
    text-shadow: 0 6px 16px rgb(0 0 0 / .35); }
  #banner h1 span { display: block; }
  #banner .sub { font: 600 30px/1.25 Barlow, sans-serif; margin-top: 18px; max-width: 640px; color: #e8f2ea; }
  .panel { background: rgb(255 255 255 / .96); color: #121a15; border-radius: 22px; padding: 24px 30px 22px;
    text-align: center; box-shadow: 0 12px 30px rgb(0 0 0 / .3); }
  .panel .pct { font: 700 64px/1 Oswald, sans-serif; margin-top: -6px; }
  .panel .tag { font: 700 26px/1 Oswald, sans-serif; text-transform: uppercase; color: #1f9d55; letter-spacing: .04em; margin-top: 6px; }
  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 14px; font: 600 18px Barlow, sans-serif; color: #56655c; }
  .legend b { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<div id="avatar" class="grass">
  <div class="chalk c"></div>
  <div class="inner">
    <svg viewBox="0 0 32 32" width="150" height="150">
      <circle cx="16" cy="16" r="15" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
      <path d="M16 9.5 L21.5 13.5 L19.4 20 L12.6 20 L10.5 13.5 Z" fill="#111"/>
      <path d="M16 9.5 V3 M21.5 13.5 L27.6 11.3 M19.4 20 L23.3 25.4 M12.6 20 L8.7 25.4 M10.5 13.5 L4.4 11.3" stroke="#111" stroke-width="1.5"/>
    </svg>
    <div class="name">Galucha</div>
  </div>
</div>

<div id="banner" class="grass">
  <div class="chalk mid"></div>
  <div class="chalk c"></div>
  <div class="content">
    <div>
      <h1><span>¿Eres cábala</span><span>o yeta?</span></h1>
      <p class="sub">Marca los partidos que viste en la galería y descubre tu efectividad como hincha.</p>
    </div>
    <div class="panel">
      <!-- Mufómetro: semicírculo yeta / neutro / cábala, aguja en 68% -->
      <svg viewBox="0 0 220 120" width="300" height="164">
        <g fill="none" stroke-width="22">
          <path d="M20 110 A90 90 0 0 1 47.7 45.1" stroke="#d64545"/>
          <path d="M47.7 45.1 A90 90 0 0 1 172.3 45.1" stroke="#c9a227" stroke-dasharray="0" />
          <path d="M172.3 45.1 A90 90 0 0 1 200 110" stroke="#1f9d55"/>
        </g>
        <line x1="110" y1="110" x2="160.3" y2="35.4" stroke="#121a15" stroke-width="7" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="10" fill="#121a15"/>
      </svg>
      <div class="pct">68%</div>
      <div class="tag">Cábala 🍀</div>
      <div class="legend"><span><b style="background:#d64545"></b>Yeta</span><span><b style="background:#c9a227"></b>Neutro</span><span><b style="background:#1f9d55"></b>Cábala</span></div>
    </div>
  </div>
</div>
</body>
</html>
